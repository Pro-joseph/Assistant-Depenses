schema: spec-driven

# Assistant Dépenses

Laravel 13 application. PHP 8.3, MySQL 8, Blade + Tailwind CSS.
AI extraction via laravel/ai SDK (Groq provider).
Async processing via Laravel Queues (database driver).
Auth via Laravel Breeze.
Testing via Pest.
All business logic lives in Jobs, never in controllers.
Controllers are thin: validate → authorize → dispatch → return view.