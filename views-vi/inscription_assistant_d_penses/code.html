<!DOCTYPE html>

<html class="light" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Inscription - Assistant Dépenses</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts: Roboto Flex -->
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface": "#f7f9fb",
                    "on-surface-variant": "#444651",
                    "secondary-fixed": "#ffddb8",
                    "surface-tint": "#4059aa",
                    "tertiary-container": "#314156",
                    "secondary-container": "#fea619",
                    "surface-container-high": "#e6e8ea",
                    "on-error-container": "#93000a",
                    "outline": "#757682",
                    "on-surface": "#191c1e",
                    "on-primary-fixed": "#00164e",
                    "on-secondary-fixed": "#2a1700",
                    "on-background": "#191c1e",
                    "background": "#f7f9fb",
                    "surface-container-lowest": "#ffffff",
                    "surface-dim": "#d8dadc",
                    "on-primary-fixed-variant": "#264191",
                    "on-error": "#ffffff",
                    "on-tertiary-container": "#9dadc6",
                    "on-secondary": "#ffffff",
                    "on-tertiary": "#ffffff",
                    "surface-container-low": "#f2f4f6",
                    "secondary": "#855300",
                    "on-tertiary-fixed-variant": "#38485d",
                    "on-primary-container": "#90a8ff",
                    "on-tertiary-fixed": "#0b1c30",
                    "primary-container": "#1e3a8a",
                    "surface-container": "#eceef0",
                    "tertiary-fixed": "#d3e4fe",
                    "inverse-on-surface": "#eff1f3",
                    "on-secondary-container": "#684000",
                    "surface-container-highest": "#e0e3e5",
                    "surface-variant": "#e0e3e5",
                    "on-primary": "#ffffff",
                    "outline-variant": "#c5c5d3",
                    "tertiary": "#1b2b3f",
                    "secondary-fixed-dim": "#ffb95f",
                    "error": "#ba1a1a",
                    "surface-bright": "#f7f9fb",
                    "inverse-primary": "#b6c4ff",
                    "error-container": "#ffdad6",
                    "primary-fixed": "#dce1ff",
                    "on-secondary-fixed-variant": "#653e00",
                    "tertiary-fixed-dim": "#b7c8e1",
                    "primary": "#00236f",
                    "inverse-surface": "#2d3133",
                    "primary-fixed-dim": "#b6c4ff"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "sm": "8px",
                    "xxl": "48px",
                    "lg": "24px",
                    "xl": "32px",
                    "xs": "4px",
                    "gutter": "24px",
                    "container-max-width": "1440px",
                    "md": "16px",
                    "base": "4px"
            },
            "fontFamily": {
                    "headline-lg": ["Roboto Flex"],
                    "body-md": ["Roboto Flex"],
                    "body-lg": ["Roboto Flex"],
                    "title-lg": ["Roboto Flex"],
                    "label-md": ["Roboto Flex"],

                    "display-lg": ["Roboto Flex"]
            },
            "fontSize": {
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "title-lg": ["20px", {"lineHeight": "28px", "fontWeight": "500"}],
                    "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        body {
            font-family: 'Roboto Flex', sans-serif;
            background-color: #f7f9fb;
        }
        .registration-card {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid #e2e8f0;
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<!-- Header / Brand Section (Simplified for Task-Focus) -->
<header class="w-full py-lg px-xl flex justify-center items-center">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary text-headline-md" data-icon="account_balance_wallet">account_balance_wallet</span>
<h1 class="text-primary font-headline-md text-headline-md font-bold tracking-tight">Assistant Dépenses</h1>
</div>
</header>
<!-- Main Registration Canvas -->
<main class="flex-grow flex items-center justify-center px-lg pb-xxl">
<div class="w-full max-w-[480px] bg-surface-container-lowest registration-card rounded-xl p-xl">
<div class="text-center mb-xl">
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-xs">Créer un compte</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Rejoignez Assistant Dépenses pour une gestion de budget simplifiée.</p>
</div>
<!-- Registration Form -->
<form class="space-y-lg" onsubmit="event.preventDefault();">
<!-- Field: Nom -->
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-outline" for="name">Nom complet</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors" data-icon="person">person</span>
<input class="w-full pl-xxl pr-md py-sm rounded-lg border border-outline-variant bg-surface-container-low focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all font-body-md text-body-md outline-none" id="name" placeholder="Jean Dupont" type="text"/>
</div>
</div>
<!-- Field: Email -->
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-outline" for="email">Adresse Email</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors" data-icon="mail">mail</span>
<input class="w-full pl-xxl pr-md py-sm rounded-lg border border-outline-variant bg-surface-container-low focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all font-body-md text-body-md outline-none" id="email" placeholder="nom@exemple.com" type="email"/>
</div>
</div>
<!-- Field: Mot de passe -->
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-outline" for="password">Mot de passe</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors" data-icon="lock">lock</span>
<input class="w-full pl-xxl pr-md py-sm rounded-lg border border-outline-variant bg-surface-container-low focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all font-body-md text-body-md outline-none" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Field: Confirmer le mot de passe -->
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-outline" for="confirm-password">Confirmer le mot de passe</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors" data-icon="lock_reset">lock_reset</span>
<input class="w-full pl-xxl pr-md py-sm rounded-lg border border-outline-variant bg-surface-container-low focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all font-body-md text-body-md outline-none" id="confirm-password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Terms -->
<div class="flex items-start gap-sm mt-md">
<input class="mt-1 rounded border-outline-variant text-primary focus:ring-primary h-4 w-4" id="terms" type="checkbox"/>
<label class="font-body-md text-body-md text-on-surface-variant" for="terms">
                        J'accepte les <a class="text-primary font-medium hover:underline" href="#">conditions d'utilisation</a> et la <a class="text-primary font-medium hover:underline" href="#">politique de confidentialité</a>.
                    </label>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary-container text-white py-sm px-lg rounded-xl font-title-lg text-title-lg hover:bg-primary transition-colors shadow-sm active:scale-[0.98] duration-150" type="submit">
                    S'inscrire
                </button>
</form>
<div class="mt-xl pt-lg border-t border-outline-variant text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Vous avez déjà un compte ? 
                    <a class="text-primary font-bold hover:underline ml-xs" href="#">Se connecter</a>
</p>
</div>
</div>
</main>
<!-- Footer Decorative Element -->
<footer class="w-full py-lg text-center opacity-50 select-none">
<p class="font-label-md text-label-md text-outline">© 2024 Assistant Dépenses — Gestion Professionnelle des Finances</p>
</footer>
<!-- Background Decoration -->
<div class="fixed top-0 left-0 w-full h-full -z-10 overflow-hidden pointer-events-none">
<div class="absolute top-[-10%] right-[-5%] w-[40%] h-[40%] bg-primary/5 rounded-full blur-[100px]"></div>
<div class="absolute bottom-[-10%] left-[-5%] w-[30%] h-[30%] bg-secondary-container/5 rounded-full blur-[80px]"></div>
</div>
<script>
        // Micro-interaction for the primary button
        const submitBtn = document.querySelector('button[type="submit"]');
        submitBtn.addEventListener('click', function() {
            this.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span>';
            setTimeout(() => {
                this.innerHTML = "S'inscrire";
            }, 2000);
        });
    </script>
</body></html>
