<!DOCTYPE html>

<html class="light" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Assistant Dépenses - Connexion</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Roboto Flex', sans-serif;
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface": "#f7f9fb",
                    "on-surface-variant": "#444651",
                    "secondary-fixed": "#ffddb8",
                    "surface-tint": "#4059aa",
                    "tertiary-container": "#314156",
                    "secondary-container": "#fea619",
                    "surface-container-high": "#e6e8ea",
                    "on-error-container": "#93000a",
                    "outline": "#757682",
                    "on-surface": "#191c1e",
                    "on-primary-fixed": "#00164e",
                    "on-secondary-fixed": "#2a1700",
                    "on-background": "#191c1e",
                    "background": "#f7f9fb",
                    "surface-container-lowest": "#ffffff",
                    "surface-dim": "#d8dadc",
                    "on-primary-fixed-variant": "#264191",
                    "on-error": "#ffffff",
                    "on-tertiary-container": "#9dadc6",
                    "on-secondary": "#ffffff",
                    "on-tertiary": "#ffffff",
                    "surface-container-low": "#f2f4f6",
                    "secondary": "#855300",
                    "on-tertiary-fixed-variant": "#38485d",
                    "on-primary-container": "#90a8ff",
                    "on-tertiary-fixed": "#0b1c30",
                    "primary-container": "#1e3a8a",
                    "surface-container": "#eceef0",
                    "tertiary-fixed": "#d3e4fe",
                    "inverse-on-surface": "#eff1f3",
                    "on-secondary-container": "#684000",
                    "surface-container-highest": "#e0e3e5",
                    "surface-variant": "#e0e3e5",
                    "on-primary": "#ffffff",
                    "outline-variant": "#c5c5d3",
                    "tertiary": "#1b2b3f",
                    "secondary-fixed-dim": "#ffb95f",
                    "error": "#ba1a1a",
                    "surface-bright": "#f7f9fb",
                    "inverse-primary": "#b6c4ff",
                    "error-container": "#ffdad6",
                    "primary-fixed": "#dce1ff",
                    "on-secondary-fixed-variant": "#653e00",
                    "tertiary-fixed-dim": "#b7c8e1",
                    "primary": "#00236f",
                    "inverse-surface": "#2d3133",
                    "primary-fixed-dim": "#b6c4ff"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "sm": "8px",
                    "xxl": "48px",
                    "lg": "24px",
                    "xl": "32px",
                    "xs": "4px",
                    "gutter": "24px",
                    "container-max-width": "1440px",
                    "md": "16px",
                    "base": "4px"
            },
            "fontFamily": {
                    "headline-lg": ["robotoFlex"],
                    "body-md": ["robotoFlex"],
                    "body-lg": ["robotoFlex"],
                    "title-lg": ["robotoFlex"],
                    "label-md": ["robotoFlex"],
                    "headline-md": ["robotoFlex"],
                    "display-lg": ["robotoFlex"]
            },
            "fontSize": {
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "title-lg": ["20px", {"lineHeight": "28px", "fontWeight": "500"}],
                    "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}]
            }
          },
        },
      }
    </script>
</head>
<body class="bg-surface min-h-screen flex flex-col relative overflow-hidden">
<!-- Background Decorative Elements -->
<div class="absolute inset-0 z-0 pointer-events-none">

<div class="absolute top-[-10%] right-[-10%] w-[500px] h-[500px] bg-primary-container rounded-full blur-[120px] opacity-10"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[400px] h-[400px] bg-secondary-container rounded-full blur-[100px] opacity-10"></div>
</div>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center p-lg relative z-10">
<div class="w-full max-w-[440px] animate-fade-in-up">
<!-- Logo Section -->
<div class="flex flex-col items-center mb-xl">
<div class="w-16 h-16 bg-primary flex items-center justify-center rounded-xl shadow-md mb-md">
<span class="material-symbols-outlined text-on-primary text-[32px]" style="font-variation-settings: 'FILL' 1;">payments</span>
</div>
<h1 class="font-headline-md text-headline-md text-primary font-bold">Assistant Dépenses</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">Gérez votre budget en toute confiance</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl shadow-md p-xl">
<h2 class="font-title-lg text-title-lg text-on-surface mb-lg">Bienvenue</h2>
<form action="#" class="space-y-lg" method="POST" onsubmit="return false;">
<!-- Email Field -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="email">Email</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full pl-xxl pr-md py-md bg-surface-container-low border border-outline-variant rounded-lg font-body-md text-body-md focus:ring-2 focus:ring-primary-container focus:border-primary transition-all outline-none" id="email" name="email" placeholder="nom@entreprise.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="password">Mot de passe</label>
<a class="font-label-md text-label-md text-primary hover:underline" href="#">Oublié ?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full pl-xxl pr-md py-md bg-surface-container-low border border-outline-variant rounded-lg font-body-md text-body-md focus:ring-2 focus:ring-primary-container focus:border-primary transition-all outline-none" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-outline hover:text-on-surface-variant transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center space-x-sm">
<input class="w-4 h-4 text-primary bg-surface-container-low border-outline-variant rounded focus:ring-primary" id="remember" type="checkbox"/>
<label class="font-body-md text-body-md text-on-surface-variant select-none" for="remember">Se souvenir de moi</label>
</div>
<!-- Submit Button -->
<button class="w-full py-md px-lg bg-primary text-on-primary rounded-xl font-title-lg text-[16px] font-semibold hover:bg-primary-container active:scale-[0.98] transition-all shadow-sm flex items-center justify-center gap-sm" type="submit">
                        Se connecter
                        <span class="material-symbols-outlined text-[18px]">login</span>
</button>
</form>
<!-- Footer Link -->
<div class="mt-xl pt-lg border-t border-outline-variant text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                        Nouveau sur la plateforme ? 
                        <a class="text-primary font-bold hover:underline transition-colors ml-xs" href="#">Créer un compte</a>
</p>
</div>
</div>
<!-- Trust Badges -->
<div class="mt-lg flex justify-center items-center gap-lg opacity-60 grayscale hover:grayscale-0 transition-all duration-500">
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-outline text-md">verified_user</span>
<span class="font-label-md text-label-md text-outline">Sécurisé par SSL</span>
</div>
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-outline text-md">gpp_good</span>
<span class="font-label-md text-label-md text-outline">Conforme RGPD</span>
</div>
</div>
</div>
</main>
<!-- Footer Decorative -->
<footer class="p-lg text-center relative z-10">
<p class="font-label-md text-label-md text-outline">© 2024 Assistant Dépenses. Tous droits réservés.</p>
</footer>
<script>
        // Simple animation trigger for entry
        document.addEventListener('DOMContentLoaded', () => {
            const card = document.querySelector('.animate-fade-in-up');
            card.style.opacity = '0';
            card.style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                card.style.transition = 'all 0.6s cubic-bezier(0.16, 1, 0.3, 1)';
                card.style.opacity = '1';
                card.style.transform = 'translateY(0)';
            }, 100);
        });

        // Password visibility toggle
        const toggleBtn = document.querySelector('button[type="button"]');
        const passwordInput = document.getElementById('password');
        
        toggleBtn.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            const icon = toggleBtn.querySelector('.material-symbols-outlined');
            icon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
        });
    </script>
</body></html>
